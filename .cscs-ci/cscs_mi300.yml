include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - build
  - test

variables:
  PERSIST_IMAGE_NAME: $CSCS_REGISTRY_PATH/x86_64/dftk-gpu:$CI_COMMIT_SHORT_SHA

build:
  stage: build
  extends: .container-builder-cscs-zen2
  variables:
    DOCKERFILE: .cscs-ci/docker/Dockerfile.build-mi300

test:
  stage: test
  extends: .container-runner-beverin-mi300
  needs: [build]
  image: $PERSIST_IMAGE_NAME
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
    SLURM_TIMELIMIT: "00:45:00"
    SLURM_MPI_TYPE: none
  script:
    - /julia-1.12.7/bin/julia --project="/dftk_source/TestEnv" -e 'using Pkg; Pkg.test("DFTK"; test_args = ["gpu"])'
